  box-shadow:0 3px 16px rgba(0,0,0,.4);}
.nav-inner{padding:0 1.25rem;height:60px;display:flex;align-items:center;justify-content:space-between;max-width:900px;margin:0 auto;}
.logo{font-family:'Outfit',sans-serif;font-weight:900;font-size:1.2rem;color:#fff;text-decoration:none;
  display:flex;align-items:center;gap:.4rem;text-shadow:0 1px 6px rgba(0,0,0,.7);}
.logo-dot{width:8px;height:8px;background:#FFD166;border-radius:50%;}
.back-btn{padding:.25rem .7rem;border-radius:99px;border:1.5px solid rgba(255,255,255,.5);
  background:rgba(0,0,0,.3);color:#fff;font-size:.75rem;font-weight:600;
  cursor:pointer;text-decoration:none;font-family:'Nunito',sans-serif;}

/* BOTTOM NAV */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);
  border-top:1px solid var(--border);display:flex;z-index:90;max-width:900px;
  margin:0 auto;left:50%;transform:translateX(-50%);width:100%;}
.bn-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:.5rem 0;cursor:pointer;color:var(--muted);font-size:.65rem;font-weight:600;
  transition:all .2s;border:none;background:none;font-family:'Nunito',sans-serif;}
.bn-item.on{color:var(--red);}
.bn-icon{font-size:1.4rem;margin-bottom:.15rem;}

.page{display:none;max-width:900px;margin:0 auto;padding:1rem 1rem 5rem;}
.page.on{display:block;}

/* ── HOME ── */
.home-header{text-align:center;padding:1.25rem 0 1rem;}
.home-header h2{font-family:'Outfit',sans-serif;font-size:1.4rem;font-weight:800;margin-bottom:.25rem;}
.home-header p{color:var(--muted);font-size:.82rem;}

/* XP bar */
.xp-bar{background:var(--card);border:1px solid var(--border);border-radius:var(--r);
  padding:.85rem 1rem;margin-bottom:1rem;display:flex;align-items:center;gap:1rem;}
.xp-num{font-family:'Outfit',sans-serif;font-size:1.5rem;font-weight:800;color:var(--gold);min-width:50px;}
.xp-label{font-size:.65rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;}
.xp-prog{flex:1;background:var(--linen);border-radius:99px;height:10px;overflow:hidden;}
.xp-fill{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--gold),var(--green));transition:width .5s;}
.streak{text-align:center;min-width:44px;}
.streak-num{font-family:'Outfit',sans-serif;font-size:1.5rem;font-weight:800;color:var(--red);}

/* TOPIC CARDS */
.topics-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:.85rem;}
.topic-card{background:var(--card);border-radius:var(--r);overflow:hidden;cursor:pointer;
  box-shadow:0 2px 10px rgba(0,0,0,.07);transition:all .2s;border:2px solid transparent;position:relative;}
.topic-card:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(0,0,0,.13);}
.topic-card.done{border-color:var(--green);}
.topic-top{height:100px;display:flex;align-items:center;justify-content:center;position:relative;}
.topic-emoji{font-size:3rem;filter:drop-shadow(0 2px 8px rgba(0,0,0,.2));}
.topic-done-badge{position:absolute;top:.4rem;right:.4rem;background:var(--green);color:#fff;
  border-radius:50%;width:22px;height:22px;display:flex;align-items:center;justify-content:center;
  font-size:.75rem;font-weight:700;}
.topic-bottom{padding:.75rem .85rem .85rem;}
.topic-name{font-family:'Outfit',sans-serif;font-weight:800;font-size:.92rem;margin-bottom:.2rem;}
.topic-count{font-size:.7rem;color:var(--muted);}
.topic-prog{margin-top:.4rem;background:var(--linen);border-radius:99px;height:5px;overflow:hidden;}
.topic-bar{height:100%;border-radius:99px;transition:width .4s;}

/* ── LESSON (4 activities) ── */
.lesson-wrap{max-width:600px;margin:0 auto;}

/* Top bar inside lesson */
.lesson-header{display:flex;align-items:center;gap:.75rem;margin-bottom:1rem;padding:.5rem 0;}
.lesson-back{background:none;border:none;cursor:pointer;font-size:1.3rem;color:var(--muted);}
.lesson-prog{flex:1;background:var(--linen);border-radius:99px;height:12px;overflow:hidden;}
.lesson-bar{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--gold),var(--green));transition:width .4s;}
.hearts{display:flex;gap:.2rem;}
.heart{font-size:1.1rem;transition:all .3s;}
.heart.lost{opacity:.2;filter:grayscale(1);transform:scale(.8);}

/* Activity card */
.act-card{background:var(--card);border-radius:var(--r);padding:1.5rem;margin-bottom:1rem;text-align:center;box-shadow:0 2px 12px rgba(0,0,0,.07);}
.act-tag{display:inline-block;padding:.18rem .65rem;border-radius:99px;font-size:.68rem;
  font-weight:700;text-transform:uppercase;letter-spacing:.08em;margin-bottom:.85rem;color:#fff;}
.act-prompt{font-family:'Outfit',sans-serif;font-size:1.6rem;font-weight:800;margin-bottom:.35rem;}
.act-sub{font-size:.85rem;color:var(--muted);}

/* Big word display */
.word-display{padding:1.5rem;background:var(--linen);border-radius:var(--r);margin:1rem 0;}
.word-ndau{font-family:'Outfit',sans-serif;font-size:2.5rem;font-weight:900;color:var(--text);}
.word-pt{font-size:1.1rem;color:var(--muted);margin-top:.3rem;font-weight:600;}
.word-en{font-size:.82rem;color:var(--muted);opacity:.7;margin-top:.15rem;}

/* MCQ options */
.opts{display:grid;gap:.6rem;}
.opt{padding:.9rem 1rem;border:2.5px solid var(--border);border-radius:var(--r);
  font-size:1rem;font-weight:600;cursor:pointer;text-align:left;
  background:var(--card);font-family:'Nunito',sans-serif;transition:all .15s;
  display:flex;align-items:center;gap:.75rem;}
.opt:hover:not(:disabled){border-color:var(--gold);background:rgba(212,144,10,.05);transform:translateX(2px);}
.opt.correct{border-color:var(--green)!important;background:rgba(26,107,46,.08);}
.opt.wrong{border-color:var(--red)!important;background:rgba(192,57,43,.08);}
.opt:disabled{cursor:default;}
.opt-letter{min-width:28px;height:28px;border-radius:50%;border:2px solid var(--border);
  display:flex;align-items:center;justify-content:center;font-size:.75rem;font-weight:800;
  color:var(--muted);transition:all .15s;}
.opt.correct .opt-letter{border-color:var(--green);background:var(--green);color:#fff;}
.opt.wrong .opt-letter{border-color:var(--red);background:var(--red);color:#fff;}

/* Image grid (pick the image) */
.img-grid{display:grid;grid-template-columns:1fr 1fr;gap:.7rem;margin:.75rem 0;}
.img-opt{border:3px solid var(--border);border-radius:var(--r);padding:.85rem;cursor:pointer;
  text-align:center;transition:all .2s;background:var(--linen);}
.img-opt:hover{border-color:var(--gold);}
.img-opt.correct{border-color:var(--green);background:rgba(26,107,46,.08);}
.img-opt.wrong{border-color:var(--red);background:rgba(192,57,43,.08);}
.img-emoji{font-size:2.8rem;display:block;margin-bottom:.4rem;}
.img-label{font-size:.82rem;font-weight:600;color:var(--muted);}

/* Write input */
.write-inp{width:100%;padding:.9rem;border:2.5px solid var(--border);border-radius:var(--r);
  font-family:'Outfit',sans-serif;font-size:1.4rem;font-weight:800;text-align:center;
  outline:none;background:var(--card);letter-spacing:.03em;transition:border-color .2s;}
.write-inp:focus{border-color:var(--teal);}
.write-inp.ok{border-color:var(--green);background:rgba(26,107,46,.04);}
.write-inp.err{border-color:var(--red);background:rgba(192,57,43,.04);}

/* Hint letters */
.hint-letters{display:flex;gap:.35rem;justify-content:center;margin:.6rem 0;flex-wrap:wrap;}
.hint-letter{width:34px;height:38px;border-bottom:2.5px solid var(--border);
  display:flex;align-items:flex-end;justify-content:center;padding-bottom:.2rem;
  font-family:'Outfit',sans-serif;font-size:1.3rem;font-weight:800;}

/* Feedback bottom bar */
.fb{position:fixed;bottom:56px;left:0;right:0;padding:1rem 1.25rem;
  display:none;z-index:80;border-top:2px solid;max-width:900px;margin:0 auto;
  left:50%;transform:translateX(-50%);width:100%;}
.fb.show{display:flex;align-items:center;justify-content:space-between;gap:1rem;}
.fb.ok{background:#d4edda;border-color:var(--green);}
.fb.err{background:#f8d7da;border-color:var(--red);}
.fb-msg{font-weight:800;font-size:1rem;}
.fb.ok .fb-msg{color:var(--green);}
.fb.err .fb-msg{color:var(--red);}
.fb-txt{font-size:.82rem;margin-top:.1rem;}
.fb.ok .fb-txt{color:#0f5132;}
.fb.err .fb-txt{color:#842029;}
.fb-btn{padding:.55rem 1.4rem;border-radius:99px;border:none;cursor:pointer;
  font-family:'Nunito',sans-serif;font-size:.9rem;font-weight:700;white-space:nowrap;}
.fb.ok .fb-btn{background:var(--green);color:#fff;}
.fb.err .fb-btn{background:var(--red);color:#fff;}

/* Continue button */
.act-footer{text-align:center;margin-top:1rem;}
.cont-btn{padding:.7rem 2rem;border-radius:99px;border:none;cursor:pointer;
  font-family:'Nunito',sans-serif;font-size:1rem;font-weight:700;
  background:var(--red);color:#fff;width:100%;max-width:320px;transition:all .2s;}
.cont-btn:hover{background:#a93226;}
.cont-btn:disabled{background:var(--linen);color:var(--muted);cursor:not-allowed;}

/* Result */
.result{text-align:center;padding:2rem 1rem 4rem;}
.result-ring{width:120px;height:120px;border-radius:50%;margin:0 auto 1.25rem;
  display:flex;align-items:center;justify-content:center;font-size:3rem;
  border:4px solid;}
.result-ring.pass{border-color:var(--green);background:rgba(26,107,46,.08);}
.result-ring.fail{border-color:var(--red);background:rgba(192,57,43,.08);}

/* DICT */
.dict-search{width:100%;padding:.7rem 1rem;border:1.5px solid var(--border);border-radius:99px;
  font-family:'Nunito',sans-serif;font-size:.9rem;outline:none;background:var(--card);
  margin-bottom:.85rem;}
.dict-search:focus{border-color:var(--red);}
.dict-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:.65rem;}
.dict-word{background:var(--card);border:1px solid var(--border);border-radius:var(--rs);
  padding:.8rem;cursor:pointer;transition:all .2s;}
.dict-word:hover{border-color:var(--red);box-shadow:0 3px 10px rgba(192,57,43,.1);}
.dw-ndau{font-family:'Outfit',sans-serif;font-size:.95rem;font-weight:800;}
.dw-pt{font-size:.75rem;color:var(--muted);margin-top:.15rem;}

/* MODAL */
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:200;
  align-items:flex-end;justify-content:center;}
.modal-bg.show{display:flex;}
.modal{background:var(--card);border-radius:var(--r) var(--r) 0 0;padding:1.5rem;

// ── BUILD LESSON QUEUE ──
function buildQueue(topic){
  const words = topic.words.filter(w=>w.pt);
  if(!words.length) return [];
  
  function shuffle(a){ return [...a].sort(()=>Math.random()-.5); }
  function wrongOpts(correct, words, field, n){
    return shuffle(words.filter(w=>w[field]!==correct[field])).slice(0,n).map(w=>w[field]);
  }

  const queue = [];
  const shuffledWords = shuffle(words);

  // ACTIVITY 1: LEARN — show word + meaning (3 words at a time, flip cards)
  // Group into batches of 3 for learn cards
  for(let i=0;i<Math.min(shuffledWords.length,9);i+=3){
    queue.push({
      type:'learn',
      words: shuffledWords.slice(i,i+3),
      actLabel:'Aprende estas palavras'
    });
  }

  // ACTIVITY 2: PICK IMAGE — see PT, choose correct Ndau (image/emoji style)
  shuffledWords.forEach(w=>{
    const wrongs = wrongOpts(w, words, 'ndau', 3);
    if(wrongs.length>=2){
      const opts = shuffle([w,...wrongs.slice(0,3).map(nd=>words.find(x=>x.ndau===nd)||{ndau:nd,emoji:'?'})]);
      queue.push({
        type:'img_pick',
        prompt: w.pt,
        promptEn: w.en||'',
        correct: w.ndau,
        opts: opts.slice(0,4),
        topic,
        actLabel:'Escolhe a palavra correcta'
      });
    }
  });

  // ACTIVITY 3: MCQ — see Ndau, choose PT meaning
  shuffledWords.forEach(w=>{
    const wrongs = wrongOpts(w, words, 'pt', 3);
    if(wrongs.length>=2){
      const opts = shuffle([w.pt,...wrongs]).slice(0,4);
      queue.push({
        type:'mcq',
        prompt: w.ndau,
        promptSub: w.en?`🇬🇧 ${w.en}`:'',
        correct: w.pt,
        opts,
        actLabel:'O que significa?'
      });
    }
  });

  // ACTIVITY 4: WRITE — see PT, type Ndau
  shuffle(shuffledWords).slice(0,5).forEach(w=>{
    queue.push({
      type:'write',
      prompt: w.pt,
      promptEn: w.en||'',
      correct: w.ndau,
      actLabel:'Escreve em Ndau'
    });
  });

  return shuffle(queue).slice(0,15);
}

// ── START TOPIC ──
function startTopic(key){
  const topic = TOPICS[key];
  const queue = buildQueue(topic);
  if(!queue.length){ alert('Sem palavras suficientes neste tópico ainda.'); return; }

  LS = { topicKey:key, topic, queue, idx:0, lives:3, score:0, correct:0, total:queue.length, _learnIdx:0, _learnFlipped:false };
  
  goToLesson();
  showAct();
}

// ── CHECK FUNCTIONS ──
function checkImgPick(el, answer, correct){
  document.querySelectorAll('.img-opt').forEach(x=>{x.onclick=null;});
  const isOk = answer===correct;
  el.classList.add(isOk?'correct':'wrong');
  if(!isOk){
    document.querySelectorAll('.img-opt').forEach(x=>{
      if(x.querySelector('.img-label')?.textContent===correct) x.classList.add('correct');
    });
  }
  doFeedback(isOk, correct);
}

function checkMCQ(btn, answer, correct){
  document.querySelectorAll('.opt').forEach(b=>b.disabled=true);
  const isOk = answer===correct;
  btn.classList.add(isOk?'correct':'wrong');
  if(!isOk){
    document.querySelectorAll('.opt').forEach(b=>{
      if(b.textContent.trim().endsWith(correct)||b.textContent.includes(correct)) b.classList.add('correct');
    });
  }
  doFeedback(isOk, correct);
}

function norm(s){
  return (s||'').toLowerCase().trim()
    .replace(/[áàâã]/g,'a').replace(/[éêèê]/g,'e')
    .replace(/[íì]/g,'i').replace(/[óôõò]/g,'o')
    .replace(/[úù]/g,'u').replace(/[-–]/g,'-');
}

function checkWrite(correct){
  const inp = document.getElementById('wInp');
  if(!inp||!inp.value.trim()) return;
  inp.disabled=true;
  const isOk = norm(inp.value)===norm(correct);
  inp.classList.add(isOk?'ok':'err');
  doFeedback(isOk, correct);
}

function updateBlanks(val, correct){
  const letters = document.querySelectorAll('.hint-letter');
  const chars = val.split('');
  letters.forEach((el,i)=>{
    el.textContent = chars[i]||'';
    el.style.color = 'var(--text)';
  });
}

// ── FEEDBACK ──
function doFeedback(isOk, correct){
  if(isOk){
    LS.score++;
    LS.correct++;
  } else {
    LS.lives--;
    if(LS.lives>0){
      // Re-add question at end
      LS.queue.push({...LS.queue[LS.idx]});
      LS.total++;
    }
  }
  document.getElementById('heartsDisplay').innerHTML =
    [0,1,2].map(i=>`<span class="heart${i>=LS.lives?' lost':''}">❤️</span>`).join('');

  const fb = document.getElementById('fbBar');
  fb.className = 'fb show '+(isOk?'ok':'err');
  document.getElementById('fbMsg').textContent = isOk?'Muito bem! ✓':'Resposta incorrecta';
  document.getElementById('fbTxt').textContent = isOk?'Continua assim!':'Correcto: '+correct;
  document.querySelector('.fb-btn').textContent = LS.lives<=0?'Ver resultado':'Continuar';
}

// ── ADVANCE ──
function flipLearnCard(){
  clearTimeout(LS._flipTimer);
  LS._learnFlipped = true;
  const inner = document.getElementById('flipInner');
  if(inner) inner.style.transform='rotateY(180deg)';
  // Change button text
  const q = LS.queue[LS.idx];
  const isLast = (LS._learnIdx||0) >= q.words.length-1;
  const btns = document.querySelectorAll('[onclick*="nextLearnWord"]');
  btns.forEach(b=>b.textContent=isLast?'Começar exercícios →':'Próxima →');
}

function nextLearnWord(isLast){
  clearTimeout(LS._flipTimer);
  const q = LS.queue[LS.idx];
  if(!LS._learnFlipped){
    // First tap = flip
    flipLearnCard();
    return;
  }
  if(isLast){
    // Done learning — advance to next activity
    LS._learnIdx=0;
    LS._learnFlipped=false;
    advanceLesson();
  } else {
    LS._learnIdx=(LS._learnIdx||0)+1;
    LS._learnFlipped=false;
    showAct();
  }
}

function prevLearnWord(){
  clearTimeout(LS._flipTimer);
  LS._learnIdx=Math.max(0,(LS._learnIdx||0)-1);
  LS._learnFlipped=false;
  showAct();
}

function advanceLesson(){
  document.getElementById('fbBar').classList.remove('show');
  if(!LS) return;
  if(LS.lives<=0){ finishLesson(false); return; }
  LS.idx++;
  if(LS.idx>=LS.queue.length){
    finishLesson(true);
  } else {
    showAct();
  }
}

// ── FINISH ──
function finishLesson(completed){
  const pct = Math.round(LS.score/Math.max(LS.idx,1)*100);
  const passed = pct>=60 && LS.lives>0;
  const stars = pct>=90?3:pct>=70?2:pct>=60?1:0;
  const xp = passed? Math.round(50*stars*(pct/100)) : 0;
  const color = LS.topic.color;
  const key = LS.topicKey;
  const topic = LS.topic;

  if(passed){
    const prev = S.done[key];
    if(!prev||pct>prev.score){
      S.done[key] = {score:pct,date:new Date().toISOString(),stars};
      S.xp = (S.xp||0)+xp;
      save();
    }
  }

  const area = document.getElementById('actArea');
  document.getElementById('heartsDisplay').innerHTML='';
  document.getElementById('lessonBar').style.width='100%';

  area.innerHTML=`
    <div class="result">
      <div class="result-ring ${passed?'pass':'fail'}">${passed?(stars===3?'🏆':stars===2?'⭐':'✓'):'✗'}</div>
      <h2 style="font-family:'Outfit',sans-serif;font-size:1.6rem;font-weight:900;margin-bottom:.4rem;">
        ${passed?'Excelente!':'Tenta de novo!'}
      </h2>
      <div style="font-family:'Outfit',sans-serif;font-size:2.5rem;font-weight:900;
        color:${passed?'var(--green)':'var(--red)'};margin:.4rem 0;">${pct}%</div>
      ${passed?`<div style="display:flex;justify-content:center;gap:1rem;margin:.75rem 0 1rem;">
        <div style="text-align:center;">
          <div style="font-size:1.5rem;">${'⭐'.repeat(stars)+'☆'.repeat(3-stars)}</div>
          <div style="font-size:.75rem;color:var(--muted);margin-top:.2rem;">${stars} estrela${stars!==1?'s':''}</div>
        </div>
        <div style="text-align:center;">
          <div style="font-family:'Outfit',sans-serif;font-size:1.5rem;font-weight:800;color:var(--gold);">+${xp}</div>
          <div style="font-size:.75rem;color:var(--muted);margin-top:.2rem;">XP</div>
        </div>
      </div>`:''}
      <div style="display:grid;gap:.6rem;max-width:320px;margin:0 auto;">
        ${passed?`<button class="cont-btn" style="background:${color};" onclick="startTopic('${key}')">
          Repetir ${topic.emoji}
        </button>`:''}
        <button class="cont-btn" ${passed?'style="background:var(--green);"':''} onclick="goPage('home')">
          ${passed?'← Outros tópicos':'← Voltar'}
        </button>
        ${!passed?`<button class="cont-btn" style="background:${color};" onclick="startTopic('${key}')">
          Tentar de novo
        </button>`:''}
      </div>
    </div>`;
}

// ── PROGRESS ──
function renderProg(){
  const doneCount = Object.keys(S.done).length;
  const total = Object.keys(TOPICS).length;
  const avgScore = doneCount?Math.round(Object.values(S.done).reduce((s,d)=>s+d.score,0)/doneCount):0;
  
  document.getElementById('progStats').innerHTML=`
    <div class="ps"><div class="ps-val" style="color:var(--green);">${doneCount}/${total}</div><div class="ps-lbl">Tópicos</div></div>
    <div class="ps"><div class="ps-val" style="color:var(--gold);">${S.xp||0}</div><div class="ps-lbl">XP Total</div></div>
    <div class="ps"><div class="ps-val" style="color:var(--purple);">${avgScore?avgScore+'%':'—'}</div><div class="ps-lbl">Média</div></div>`;

  document.getElementById('progTopics').innerHTML=Object.entries(TOPICS).map(([key,t])=>{
    const done = S.done[key];
    const pct = done?done.score:0;
    const stars = done?.stars||0;
    return `<div style="background:var(--card);border:1px solid var(--border);border-radius:var(--r);
      padding:1rem;margin-bottom:.65rem;display:flex;align-items:center;gap:.75rem;">
      <span style="font-size:1.5rem;">${t.emoji}</span>
      <div style="flex:1;">
        <div style="display:flex;justify-content:space-between;margin-bottom:.3rem;">
          <span style="font-family:'Outfit',sans-serif;font-weight:700;font-size:.88rem;">${t.name}</span>
          <span style="font-size:.78rem;color:var(--muted);">${done?pct+'% · '+'⭐'.repeat(stars):'Por fazer'}</span>
        </div>
        <div style="background:var(--linen);border-radius:99px;height:7px;overflow:hidden;">
          <div style="height:100%;border-radius:99px;background:${t.color};width:${pct}%;transition:width .5s;"></div>
        </div>
      </div>
      ${done?`<button onclick="startTopic('${key}')" style="padding:.28rem .7rem;border-radius:99px;border:1.5px solid ${t.color};background:transparent;color:${t.color};font-size:.73rem;font-weight:700;cursor:pointer;">Repetir</button>`:''}
    </div>`;
  }).join('');
}

// ─── LEARN SECTION ───
function renderLearnHome(){
  const done = LESSONS.filter(l=>S.done_learn&&S.done_learn[l.id]).length;
  document.getElementById('learnGrid').innerHTML = LESSONS.map(l=>{
    const isDone = S.done_learn&&S.done_learn[l.id];
    const score = isDone?S.done_learn[l.id].score:0;
    return `<div class="topic-card${isDone?' done':''}" onclick="openLesson('${l.id}')"
      style="border-color:${isDone?'var(--green)':'transparent'}">
      ${isDone?'<div class="topic-done-badge">✓</div>':''}
      <div class="topic-top" style="background:${l.color}20;">
        <span style="font-size:2.5rem;">${l.icon}</span>
      </div>
      <div class="topic-bottom">
        <div class="topic-name">${l.title}</div>
        <div class="topic-count">${l.sections.length} secções · Quiz final</div>
        <div class="topic-prog">
          <div class="topic-bar" style="width:${score}%;background:${l.color};"></div>
        </div>
      </div>
    </div>`;
  }).join('');
}

let CL = null; // current lesson {lesson, sectionIdx, phase:'read'|'quiz', quizIdx, score}

function openLesson(id){
  const lesson = LESSONS.find(l=>l.id===id);
  if(!lesson) return;
  CL = {lesson, sectionIdx:0, phase:'read', quizIdx:0, score:0};
  showLearnPage();
  showSection();
}

function showLearnPage(){
  document.querySelectorAll('.page').forEach(x=>x.classList.remove('on'));
  document.querySelectorAll('.bn-item').forEach(x=>x.classList.remove('on'));
  document.getElementById('pg-learn-lesson').classList.add('on');
  document.getElementById('fbBar').classList.remove('show');
}

function exitLearnLesson(){
  document.getElementById('fbBar').classList.remove('show');
  CL=null;
  goPage('learn-home');
}

function showSection(){
  if(!CL) return;
  const {lesson, sectionIdx, phase, quizIdx} = CL;
  const color = lesson.color;
  const area = document.getElementById('learnLessonArea');

  // Header progress
  const totalSteps = lesson.sections.length + lesson.quiz.length;
  const doneSteps = (phase==='read'?sectionIdx:lesson.sections.length+quizIdx);
  document.getElementById('learnBar').style.width = (doneSteps/totalSteps*100)+'%';

  // QUIZ PHASE
  if(phase==='quiz'){
    const q = lesson.quiz[quizIdx];
    const total = lesson.quiz.length;
    area.innerHTML = `
      <div style="text-align:center;margin-bottom:.5rem;">
        <div style="display:inline-block;padding:.2rem .75rem;border-radius:99px;font-size:.72rem;
          font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#fff;background:${color};">
          Quiz final — ${quizIdx+1}/${total}
        </div>
      </div>
      <div class="act-card" style="border-top:3px solid ${color};">
        <div class="act-prompt" style="font-size:1.2rem;">${q.q}</div>
      </div>
      <div class="opts">
        ${q.opts.map((o,i)=>`
          <button class="opt" onclick="checkLearnQuiz(this,'${o.replace(/'/g,"\'")}','${q.correct.replace(/'/g,"\'")}')">
            <span class="opt-letter">${'ABCD'[i]}</span>${o}
          </button>`).join('')}
      </div>`;
    return;
  }

  // READ PHASE
  const sec = lesson.sections[sectionIdx];
  const isLast = sectionIdx >= lesson.sections.length-1;
  let content = '';

  if(sec.type==='intro'){
    content = `
      <div style="text-align:center;margin-bottom:1.25rem;">
        <span style="font-size:3rem;">${lesson.icon}</span>
        <h2 style="font-family:'Outfit',sans-serif;font-size:1.3rem;font-weight:800;margin-top:.5rem;">${sec.title}</h2>
      </div>
      <div style="background:${color}15;border-left:4px solid ${color};border-radius:0 var(--rs) var(--rs) 0;
        padding:1rem 1.1rem;font-size:.95rem;line-height:1.75;color:var(--text);">
        ${sec.text}
      </div>`;
  }

  else if(sec.type==='alphabet'){
    content = `
      <h3 style="font-family:'Outfit',sans-serif;font-weight:800;margin-bottom:1rem;">${sec.title}</h3>
      <div style="display:grid;gap:.45rem;">
        ${sec.items.map(item=>`
          <div style="display:flex;align-items:center;gap:.75rem;padding:.55rem .8rem;
            background:var(--linen);border-radius:var(--rs);">
            <span style="font-family:'Outfit',sans-serif;font-size:1.1rem;font-weight:900;
              color:${color};min-width:70px;">${item.letter}</span>
            <span style="font-size:.8rem;color:var(--muted);min-width:60px;">[${item.sound}]</span>
            <span style="font-size:.8rem;font-weight:600;min-width:100px;">${item.example}</span>
            <span style="font-size:.72rem;color:var(--muted);font-style:italic;">${item.note}</span>
          </div>`).join('')}
      </div>`;
  }

  else if(sec.type==='numbers_grid'){
    content = `
      <h3 style="font-family:'Outfit',sans-serif;font-weight:800;margin-bottom:1rem;">${sec.title}</h3>
      <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:.55rem;">
        ${sec.items.map(item=>`
          <div style="background:var(--linen);border-radius:var(--rs);padding:.65rem;text-align:center;">
            <div style="font-family:'Outfit',sans-serif;font-size:1.5rem;font-weight:900;color:${color};">${item.num}</div>
            <div style="font-weight:700;font-size:.88rem;margin-top:.15rem;">${item.ndau}</div>
          </div>`).join('')}
      </div>`;
  }

  else if(sec.type==='table'){
    content = `
      <h3 style="font-family:'Outfit',sans-serif;font-weight:800;margin-bottom:.85rem;">${sec.title}</h3>
      <div style="overflow-x:auto;">
        <table style="width:100%;border-collapse:collapse;min-width:320px;">
          <thead><tr style="background:${color};">
            ${sec.headers.map(h=>`<th style="padding:.55rem .75rem;text-align:left;color:#fff;font-size:.8rem;font-weight:700;">${h}</th>`).join('')}
          </tr></thead>
          <tbody>
            ${sec.rows.map((row,i)=>`<tr style="background:${i%2?'var(--linen)':'var(--card)'};border-bottom:1px solid var(--border);">
              ${row.map((cell,ci)=>`<td style="padding:.55rem .75rem;font-size:.85rem;${ci===0?`font-family:'Outfit',sans-serif;font-weight:800;color:${color};`:''}">${cell}</td>`).join('')}
            </tr>`).join('')}
          </tbody>
        </table>
      </div>`;
  }

  else if(sec.type==='dialogue'){
    content = `
      <h3 style="font-family:'Outfit',sans-serif;font-weight:800;margin-bottom:.85rem;">${sec.title}</h3>
      <div style="display:grid;gap:.5rem;">
        ${sec.lines.map(line=>`
          <div style="display:flex;gap:.6rem;align-items:flex-start;
            ${line.speaker==='B'?'flex-direction:row-reverse;text-align:right;':''}">
            <div style="min-width:28px;height:28px;border-radius:50%;background:${color};
              display:flex;align-items:center;justify-content:center;
              font-size:.72rem;font-weight:800;color:#fff;flex-shrink:0;">${line.speaker}</div>
            <div style="background:${line.speaker==='A'?color+'15':'var(--linen)'};
              border-radius:var(--rs);padding:.6rem .85rem;max-width:80%;">
              <div style="font-family:'Outfit',sans-serif;font-weight:700;font-size:.95rem;">${line.line}</div>
              <div style="font-size:.75rem;color:var(--muted);margin-top:.15rem;font-style:italic;">${line.pt}</div>
            </div>
          </div>`).join('')}
      </div>`;
  }

  else if(sec.type==='highlight'){
    content = `
      <div style="background:${color}10;border:1.5px solid ${color}40;border-radius:var(--r);padding:1.1rem;">
        <h3 style="font-family:'Outfit',sans-serif;font-weight:800;color:${color};margin-bottom:.6rem;">${sec.title}</h3>
        ${sec.text?`<p style="font-size:.88rem;margin-bottom:.75rem;line-height:1.7;">${sec.text}</p>`:''}
        <div style="display:grid;gap:.4rem;">
          ${sec.examples.map(ex=>`
            <div style="background:var(--card);border-radius:var(--rs);padding:.55rem .8rem;
              font-size:.88rem;font-weight:600;border-left:3px solid ${color};">${ex}</div>`).join('')}
        </div>
      </div>`;
  }

  area.innerHTML = `
    <div class="act-card" style="text-align:left;padding:1.25rem;">
      ${content}
    </div>
    <button class="cont-btn" onclick="nextSection()" style="background:${color};">
      ${isLast?'Fazer Quiz Final →':'Próxima →'}
    </button>`;
}

function nextSection(){
  if(!CL) return;
  const {lesson} = CL;
  CL.sectionIdx++;
  if(CL.sectionIdx >= lesson.sections.length){
    CL.phase = 'quiz';
    CL.quizIdx = 0;
  }
  showSection();
}

function checkLearnQuiz(btn, answer, correct){
  document.querySelectorAll('.opt').forEach(b=>b.disabled=true);
  const isOk = answer===correct;
  btn.classList.add(isOk?'correct':'wrong');
  if(!isOk){
    document.querySelectorAll('.opt').forEach(b=>{
      if(b.textContent.includes(correct)) b.classList.add('correct');
    });
  } else { CL.score++; }

  const fb = document.getElementById('fbBar');
  fb.className = 'fb show '+(isOk?'ok':'err');
  document.getElementById('fbMsg').textContent = isOk?'Correcto! ✓':'Errado';
  document.getElementById('fbTxt').textContent = isOk?'':' Correcto: '+correct;
  document.querySelector('.fb-btn').textContent =
    CL.quizIdx >= CL.lesson.quiz.length-1 ? 'Ver resultado' : 'Continuar';
  document.querySelector('.fb-btn').onclick = nextLearnQuiz;
}

function nextLearnQuiz(){
  document.getElementById('fbBar').classList.remove('show');
  CL.quizIdx++;
  if(CL.quizIdx >= CL.lesson.quiz.length){
    finishLearnLesson();
  } else {
    showSection();
  }
}

function finishLearnLesson(){
  const {lesson, score} = CL;
  const total = lesson.quiz.length;
  const pct = Math.round(score/total*100);
  const passed = pct>=60;
  const stars = pct>=90?3:pct>=70?2:pct>=60?1:0;
  const xp = passed?Math.round(40*stars):0;
  const color = lesson.color;

  if(passed){
    S.done_learn = S.done_learn||{};
    S.done_learn[lesson.id] = {score:pct,stars,date:new Date().toISOString()};
    S.xp=(S.xp||0)+xp;
    save();
  }

  const lId = lesson.id;
  CL=null;
  document.getElementById('learnLessonArea').innerHTML=`
    <div class="result">
      <div class="result-ring ${passed?'pass':'fail'}">${passed?(stars===3?'🏆':stars===2?'⭐':'✓'):'✗'}</div>
      <h2 style="font-family:'Outfit',sans-serif;font-size:1.5rem;font-weight:900;margin-bottom:.4rem;">
        ${passed?'Lição completa!':'Tenta de novo!'}
      </h2>
      <div style="font-family:'Outfit',sans-serif;font-size:2.5rem;font-weight:900;
        color:${passed?'var(--green)':'var(--red)'};margin:.4rem 0;">${pct}%</div>
      ${passed?`<div style="font-size:.85rem;color:var(--gold);font-weight:700;margin-bottom:.75rem;">+${xp} XP · ${'⭐'.repeat(stars)+'☆'.repeat(3-stars)}</div>`:''}
      <div style="display:grid;gap:.6rem;max-width:320px;margin:0 auto;">
        <button class="cont-btn" style="background:${color};" onclick="openLesson('${lId}')">
          Repetir lição
        </button>
        <button class="cont-btn" style="background:var(--green);" onclick="goPage('learn-home')">
          ← Lições
        </button>
      </div>
    </div>`;
}

// ── INIT ──
renderHome();
renderDict();
renderLearnHome();
</script>
</body>
</html>
